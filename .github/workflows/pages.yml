name: Build and deploy dashboard

on:
  push:
    branches: [claude/new-session-mbwcqe, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests gate the deploy: one of them asserts the page carries no
      # identifying or medical terms. A Pages site is public even when the
      # repository is private, so that check must run before publishing.
      - name: Run tests
        run: python3 tools/test_coachkit.py
      - name: Build site
        run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
